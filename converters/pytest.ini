[pytest]
# Pytest configuration for Release Dashboard Application

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
console_output_style = progress
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage configuration
# Minimum coverage thresholds (fail if below)
[coverage:run]
source =
    src
    csv_to_json
omit =
    */tests/*
    */test_*.py
    **/__pycache__/*

[coverage:report]
# Fail if overall coverage is below 80%
fail_under = 80
precision = 2
show_missing = True
skip_covered = False

# Exclude specific lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Timeout for long-running tests (seconds)
timeout = 300
