name: Tests & Coverage

on:
  push:
    branches: [main, develop, 005-project-organization]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests & Check Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov=csv_to_json \
          --cov-report=xml --cov-report=html \
          --cov-fail-under=80 \
          --tb=short
      continue-on-error: false

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Generate coverage report
      if: always()
      run: |
        echo "## Coverage Report 📊" >> $GITHUB_STEP_SUMMARY
        coverage report >> $GITHUB_STEP_SUMMARY

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('coverage.xml', 'utf8');
          if (coverage.includes('line-rate')) {
            const match = coverage.match(/line-rate="([\d.]+)"/);
            if (match) {
              const rate = parseFloat(match[1]) * 100;
              const comment = `### Test Coverage: ${rate.toFixed(1)}%\n\n${rate >= 80 ? '✅ Meets minimum requirement (80%)' : '❌ Below minimum requirement (80%)'}`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          }

  test-result:
    name: Test Result Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All tests passed"
            exit 0
          else
            echo "❌ Tests failed - PR cannot be merged"
            exit 1
          fi
