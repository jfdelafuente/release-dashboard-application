name: Code Quality & Linting

on:
  push:
    branches: [main, develop, 005-project-organization]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort

    - name: Run flake8 (style guide enforcement)
      run: |
        echo "Running flake8 style checks..."
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run black (code formatter check)
      run: |
        echo "Checking code formatting with black..."
        black --check src tests --diff || true

    - name: Run isort (import sorting check)
      run: |
        echo "Checking import sorting with isort..."
        isort --check-only src tests --diff || true

    - name: Run pylint (code analysis)
      run: |
        echo "Running pylint analysis..."
        find src tests -name "*.py" -type f | xargs pylint --exit-zero --jobs=0 \
          --disable=missing-docstring,too-many-arguments,too-few-public-methods \
          2>&1 | tee pylint-report.txt || true

    - name: Check Python syntax
      run: |
        echo "Checking Python syntax..."
        python -m py_compile src/converters/*.py tests/**/*.py || true

    - name: Upload pylint report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: pylint-report
        path: pylint-report.txt

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run bandit (security check)
      run: |
        echo "Running security checks with bandit..."
        bandit -r src --skip B101,B601 --format json -o bandit-report.json || true
        bandit -r src --skip B101,B601 || true

    - name: Upload bandit report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: bandit-report
        path: bandit-report.json

  result:
    name: Lint Result Summary
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: always()
    steps:
      - name: Report results
        run: |
          echo "✅ Code quality checks completed"
          echo "- flake8 style validation"
          echo "- black formatting check"
          echo "- isort import organization"
          echo "- pylint code analysis"
          echo "- bandit security checks"
