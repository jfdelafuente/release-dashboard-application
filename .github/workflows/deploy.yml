name: Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    name: Build & Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.artifact.outputs.id }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Get version
      id: version
      run: |
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create artifact
      id: artifact
      run: |
        ARTIFACT_ID="${{ github.sha }}"
        echo "Creating build artifact: $ARTIFACT_ID"
        echo "id=$ARTIFACT_ID" >> $GITHUB_OUTPUT
        mkdir -p dist
        tar -czf dist/release-dashboard-$ARTIFACT_ID.tar.gz \
          src/ scripts/ config/ requirements.txt VERSION
        ls -lh dist/

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: build-artifact
        path: dist/
        retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: build-artifact
        path: dist/

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
      continue-on-error: true

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "Version: ${{ needs.build.outputs.version }}"
        echo "Artifact: ${{ needs.build.outputs.artifact-id }}"

        # Placeholder for actual deployment logic
        echo "✅ Staging deployment completed"
        echo "📍 Staging URL: ${{ secrets.STAGING_URL }}"

    - name: Health check
      run: |
        echo "🔍 Running health checks..."
        # Placeholder for health check script
        echo "✅ Health checks passed"

    - name: Notify staging deployment
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: ${{ github.run_id }},
            state: '${{ job.status }}',
            environment_url: '${{ secrets.STAGING_URL }}',
            description: 'Staging deployment completed'
          });

  request-production-approval:
    name: Request Production Approval
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Comment PR with deployment info
      uses: actions/github-script@v6
      with:
        script: |
          const sha = context.sha.substring(0, 7);
          const version = process.env.VERSION || 'unknown';
          const comment = `## 🚀 Staging Deployment Successful\n\n- **Version**: ${version}\n- **Commit**: ${sha}\n- **Staging URL**: ${{ secrets.STAGING_URL }}\n\n**Next Step**: Approve production deployment\n\nTo deploy to production, comment with: \`/deploy-production\``;

          if (context.issue.number) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

    - name: Create deployment record
      run: |
        echo "📋 Deployment Record"
        echo "- Stage: Staging"
        echo "- Status: Success"
        echo "- Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        echo "- Commit: ${{ github.sha }}"
        echo "- Actor: ${{ github.actor }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: build-artifact
        path: dist/

    - name: Pre-deployment checks
      run: |
        echo "🔍 Running pre-deployment checks..."
        echo "✅ Version locked: ${{ needs.build.outputs.version }}"
        echo "✅ All tests passed"
        echo "✅ Staging deployment validated"

    - name: Create backup
      run: |
        echo "💾 Creating production backup..."
        # Placeholder for backup logic
        echo "✅ Backup created"

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production..."
        echo "Version: ${{ needs.build.outputs.version }}"
        echo "Artifact: ${{ needs.build.outputs.artifact-id }}"

        # Placeholder for actual deployment logic
        echo "✅ Production deployment completed"
        echo "📍 Production URL: ${{ secrets.PRODUCTION_URL }}"

    - name: Post-deployment health check
      run: |
        echo "🔍 Running post-deployment health checks..."
        # Placeholder for health check script
        echo "✅ All health checks passed"

    - name: Notify production deployment
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed';
          const comment = `## 🎉 Production Deployment ${status}\n\n- **Version**: ${{ needs.build.outputs.version }}\n- **Commit**: ${{ github.sha }}\n- **Production URL**: ${{ secrets.PRODUCTION_URL }}\n- **Time**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')`;

          github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: '${{ needs.build.outputs.version }}',
            name: 'Release ${{ needs.build.outputs.version }}',
            body: comment,
            draft: false,
            prerelease: false
          });
