name: Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      component:
        description: 'Component to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - converters
          - dashboards
          - both

jobs:
  build:
    name: Build & Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.artifact.outputs.id }}
      artifact-name: ${{ steps.artifact.outputs.artifact-name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Create artifact
      id: artifact
      run: |
        ARTIFACT_ID="${{ github.sha }}"
        COMPONENT="${{ github.event.inputs.component }}"
        mkdir -p dist

        echo "Creating build artifact for component: $COMPONENT"

        if [ "$COMPONENT" = "converters" ] || [ "$COMPONENT" = "both" ]; then
          echo "📦 Including converters..."
          tar -czf dist/release-dashboard-converters-$ARTIFACT_ID.tar.gz \
            converters/ scripts/generate-dashboards.sh scripts/README.md VERSION
        fi

        if [ "$COMPONENT" = "dashboards" ] || [ "$COMPONENT" = "both" ]; then
          echo "📦 Including dashboards..."
          tar -czf dist/release-dashboard-dashboards-$ARTIFACT_ID.tar.gz \
            dashboards/ data/ VERSION
        fi

        if [ "$COMPONENT" = "both" ]; then
          echo "📦 Including complete release..."
          tar -czf dist/release-dashboard-complete-$ARTIFACT_ID.tar.gz \
            converters/ dashboards/ data/ scripts/ VERSION
          ARTIFACT_NAME="complete"
        elif [ "$COMPONENT" = "converters" ]; then
          ARTIFACT_NAME="converters"
        else
          ARTIFACT_NAME="dashboards"
        fi

        echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
        echo "id=$ARTIFACT_ID" >> $GITHUB_OUTPUT
        ls -lh dist/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: dist/
        retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'staging'
    environment:
      name: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifact
        path: dist/

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p ${{ secrets.STAGING_PORT }} ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to staging
      run: |
        COMPONENT="${{ github.event.inputs.component }}"
        ARTIFACT_ID="${{ needs.build.outputs.artifact-id }}"
        ARTIFACT_NAME="${{ needs.build.outputs.artifact-name }}"

        echo "🚀 Deploying $COMPONENT to staging environment..."
        echo "Version: ${{ needs.build.outputs.version }}"
        echo "Artifact: $ARTIFACT_ID"

        # Upload artifact to staging server
        scp -P ${{ secrets.STAGING_PORT }} dist/release-dashboard-$ARTIFACT_NAME-$ARTIFACT_ID.tar.gz \
          ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/tmp/

        # Extract and deploy based on component
        ssh -p ${{ secrets.STAGING_PORT }} ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
        set -e
        COMPONENT="$COMPONENT"
        ARTIFACT_ID="$ARTIFACT_ID"
        ARTIFACT_NAME="$ARTIFACT_NAME"

        echo "📦 Extracting artifact..."
        cd /var/www/release-dashboard-staging
        tar -xzf /tmp/release-dashboard-$ARTIFACT_NAME-$ARTIFACT_ID.tar.gz

        if [ "$COMPONENT" = "converters" ] || [ "$COMPONENT" = "both" ]; then
          echo "🔧 Installing converter dependencies..."
          cd converters
          pip install -r requirements.txt
          cd ..
        fi

        if [ "$COMPONENT" = "dashboards" ] || [ "$COMPONENT" = "both" ]; then
          echo "📊 Dashboards deployed (no dependencies needed)"
        fi

        echo "✅ Staging deployment completed"
        EOF

        echo "📍 Staging URL: ${{ secrets.STAGING_URL }}"

    - name: Health check
      run: |
        echo "🔍 Running health checks..."
        sleep 5

        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_URL }})
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ Health checks passed (HTTP $RESPONSE)"
        else
          echo "❌ Health check failed (HTTP $RESPONSE)"
          exit 1
        fi

    - name: Notify staging deployment
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed';
          const component = '${{ github.event.inputs.component }}';
          const comment = `## 🚀 Staging Deployment ${status}\n\n- **Component**: ${component}\n- **Version**: ${{ needs.build.outputs.version }}\n- **Commit**: ${{ github.sha }}\n- **Staging URL**: ${{ secrets.STAGING_URL }}\n- **Environment**: Staging VPS\n\n**Next Step**: Test the staging deployment, then approve production deployment if ready.`;

          if (context.issue.number) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  request-production-approval:
    name: Request Production Approval
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always()

    steps:
    - name: Comment PR with deployment info
      uses: actions/github-script@v6
      with:
        script: |
          const sha = context.sha.substring(0, 7);
          const component = '${{ github.event.inputs.component }}';
          const comment = `## 🚀 Staging Deployment Successful\n\n- **Component**: ${component}\n- **Version**: ${{ needs.build.outputs.version }}\n- **Commit**: ${sha}\n- **Staging URL**: ${{ secrets.STAGING_URL }}\n\n**Next Step**: Test staging, then approve production deployment\n\nTo deploy to production:\n\`\`\`\ncomponent=${{ github.event.inputs.component }}\nenvironment=production\n\`\`\``;

          if (context.issue.number) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

    - name: Create deployment record
      run: |
        echo "📋 Deployment Record"
        echo "- Stage: Staging"
        echo "- Status: Success"
        echo "- Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        echo "- Commit: ${{ github.sha }}"
        echo "- Actor: ${{ github.actor }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifact
        path: dist/

    - name: Pre-deployment checks
      run: |
        echo "🔍 Running pre-deployment checks..."
        echo "✅ Version locked: ${{ needs.build.outputs.version }}"
        echo "✅ All tests passed"
        echo "✅ Staging deployment validated"

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p ${{ secrets.PRODUCTION_PORT }} ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Create backup
      run: |
        echo "💾 Creating production backup..."
        ssh -p ${{ secrets.PRODUCTION_PORT }} ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
        set -e
        BACKUP_DIR="/var/backups/release-dashboard/$(date +%Y%m%d-%H%M%S)"
        mkdir -p "$BACKUP_DIR"
        cp -r /var/www/release-dashboard/* "$BACKUP_DIR/" || true
        echo "✅ Backup created at $BACKUP_DIR"
        EOF

    - name: Deploy to production
      run: |
        COMPONENT="${{ github.event.inputs.component }}"
        ARTIFACT_ID="${{ needs.build.outputs.artifact-id }}"
        ARTIFACT_NAME="${{ needs.build.outputs.artifact-name }}"

        echo "🚀 Deploying $COMPONENT to production..."
        echo "Version: ${{ needs.build.outputs.version }}"
        echo "Artifact: $ARTIFACT_ID"

        # Upload artifact to production server
        scp -P ${{ secrets.PRODUCTION_PORT }} dist/release-dashboard-$ARTIFACT_NAME-$ARTIFACT_ID.tar.gz \
          ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/tmp/

        # Extract and deploy based on component
        ssh -p ${{ secrets.PRODUCTION_PORT }} ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
        set -e
        COMPONENT="$COMPONENT"
        ARTIFACT_ID="$ARTIFACT_ID"
        ARTIFACT_NAME="$ARTIFACT_NAME"

        echo "📦 Extracting artifact..."
        cd /var/www/release-dashboard
        tar -xzf /tmp/release-dashboard-$ARTIFACT_NAME-$ARTIFACT_ID.tar.gz

        if [ "$COMPONENT" = "converters" ] || [ "$COMPONENT" = "both" ]; then
          echo "🔧 Installing converter dependencies..."
          cd converters
          pip install -r requirements.txt
          cd ..
        fi

        if [ "$COMPONENT" = "dashboards" ] || [ "$COMPONENT" = "both" ]; then
          echo "📊 Dashboards deployed (no dependencies needed)"
        fi

        echo "✅ Production deployment completed"
        EOF

        echo "📍 Production URL: ${{ secrets.PRODUCTION_URL }}"

    - name: Post-deployment health check
      run: |
        echo "🔍 Running post-deployment health checks..."
        sleep 5

        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_URL }})
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ Health checks passed (HTTP $RESPONSE)"
        else
          echo "❌ Health check failed (HTTP $RESPONSE)"
          exit 1
        fi

    - name: Notify production deployment
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed';
          const component = '${{ github.event.inputs.component }}';
          const comment = `## 🎉 Production Deployment ${status}\n\n- **Component**: ${component}\n- **Version**: ${{ needs.build.outputs.version }}\n- **Commit**: ${{ github.sha }}\n- **Production URL**: ${{ secrets.PRODUCTION_URL }}\n- **Environment**: Production VPS\n- **Time**: ${new Date().toISOString()}`;

          github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: '${{ needs.build.outputs.version }}',
            name: 'Release ${{ needs.build.outputs.version }} (${{ github.event.inputs.component }})',
            body: comment,
            draft: false,
            prerelease: false
          });
