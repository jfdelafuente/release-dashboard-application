[pytest]
# Pytest configuration for CSV Upload API

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (services, database)
    e2e: End-to-end tests (full workflow)
    slow: Slow tests (performance, large files)
    upload: Upload endpoint tests
    validation: Validation pipeline tests
    encoding: Encoding detection tests
    delimiter: Delimiter detection tests

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -v

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_file = tests/pytest.log
log_file_level = DEBUG

# Timeout for tests (prevent hanging)
timeout = 300
timeout_method = thread

# Minimum Python version
minversion = 3.8
